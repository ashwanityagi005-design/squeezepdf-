name: Build SqueezePDF APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Install Tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick

      # 1. नीला-पीला HD लोगो जनरेट करना
      - name: Generate Blue-Yellow Logo
        run: |
          cat << 'EOF' > app_icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
            <rect width="512" height="512" rx="112" fill="#FFFFFF"/>
            <path d="M140 80 L310 80 L382 152 L382 432 A24 24 0 0 1 358 456 L154 456 A24 24 0 0 1 130 432 L130 90 A10 10 0 0 1 140 80 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="6"/>
            <path d="M310 80 L382 152 L326 152 A16 16 0 0 1 310 136 Z" fill="#2563EB"/>
            <rect x="176" y="148" width="110" height="16" rx="8" fill="#F59E0B"/>
            <circle cx="256" cy="280" r="54" fill="#EFF6FF"/>
            <path d="M256 220 L256 316 M224 284 L256 316 L288 284" stroke="#2563EB" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="190" y="356" width="132" height="14" rx="7" fill="#10B981"/>
          </svg>
          EOF
          rsvg-convert -w 1024 -h 1024 app_icon.svg -o icon_1024.png

      # 2. पूरी ऐप के अंदर से PaperKnife का ज़िक्र हटाना और SqueezePDF करना
      - name: Complete Rebranding to SqueezePDF
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          // फ़ाइलों को स्कैन करके टेक्स्ट बदलने वाला फ़ंक्शन
          function replaceInFile(filePath) {
            try {
              let text = fs.readFileSync(filePath, "utf8");
              let changed = false;
              if (text.includes("PaperKnife") || text.includes("Paper Knife") || text.includes("paperknife")) {
                text = text.replace(/PaperKnife/g, "SqueezePDF");
                text = text.replace(/Paper Knife/g, "SqueezePDF");
                text = text.replace(/paperknife/g, "squeezepdf");
                fs.writeFileSync(filePath, text, "utf8");
                changed = true;
              }
              if (changed) console.log("Rebranded:", filePath);
            } catch (e) {}
          }

          function walkDir(dir) {
            const list = fs.readdirSync(dir);
            list.forEach(file => {
              const full = path.join(dir, file);
              const stat = fs.statSync(full);
              if (stat.isDirectory() && !full.includes("node_modules") && !full.includes(".git") && !full.includes("dist")) {
                walkDir(full);
              } else if (file.endsWith(".tsx") || file.endsWith(".ts") || file.endsWith(".jsx") || file.endsWith(".js") || file.endsWith(".html") || file.endsWith(".json") || file.endsWith(".xml")) {
                replaceInFile(full);
              }
            });
          }

          // src, android और index.html को साफ़ करें
          if (fs.existsSync("src")) walkDir("src");
          if (fs.existsSync("index.html")) replaceInFile("index.html");
          if (fs.existsSync("capacitor.config.ts")) replaceInFile("capacitor.config.ts");
          if (fs.existsSync("capacitor.config.json")) replaceInFile("capacitor.config.json");
          if (fs.existsSync("android/app/src/main/res/values/strings.xml")) replaceInFile("android/app/src/main/res/values/strings.xml");
          '

      # 3. डिपेंडेंसी और बिल्ड
      - name: Install Dependencies & Build Web App
        run: |
          npm ci || npm install
          npm run build
          npx cap sync android

      # 4. नया लोगो लगाना
      - name: Apply App Icons
        run: |
          for dir in android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            if [ -d "$dir" ]; then
              convert icon_1024.png -resize 96x96 "$dir/ic_launcher.png"
              convert icon_1024.png -resize 96x96 "$dir/ic_launcher_round.png"
              convert icon_1024.png -resize 96x96 "$dir/ic_launcher_foreground.png" || true
            fi
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.png

      # 5. स्थायी की (Fixed Keystore) से साइन करना (ताकि इन-प्लेस अपडेट काम करे)
      - name: Compile and Sign Release APK with Permanent Seed
        run: |
          # एक स्थायी और फिक्स की-स्टोर बनाएँ ताकि हर बिल्ड का सिग्नेचर एक जैसा रहे
          keytool -genkeypair -v \
            -keystore /tmp/squeezer_permanent.keystore \
            -alias squeezepdf_master \
            -keyalg RSA \
            -keysize 2048 \
            -validity 20000 \
            -storepass "SqueezeSecurePass123" \
            -keypass "SqueezeSecurePass123" \
            -dname "CN=SqueezePDF, OU=Mobile, O=SqueezeApp, L=Panipat, ST=Haryana, C=IN"

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=/tmp/squeezer_permanent.keystore \
            -Pandroid.injected.signing.store.password=SqueezeSecurePass123 \
            -Pandroid.injected.signing.key.alias=squeezepdf_master \
            -Pandroid.injected.signing.key.password=SqueezeSecurePass123 \
            --no-daemon
          cd ..
          mv android/app/build/outputs/apk/release/*.apk ./SqueezePDF-v${{ github.run_number }}.apk

      # 6. APK अपलोड करना
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SqueezePDF-Build-${{ github.run_number }}
          path: SqueezePDF-v${{ github.run_number }}.apk
          if-no-files-found: error
