name: Build SqueezePDF APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Install Tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick

      # 1. नीला-पीला HD लोगो जनरेट करना
      - name: Generate Blue-Yellow Logo
        run: |
          cat << 'EOF' > app_icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
            <rect width="512" height="512" rx="112" fill="#FFFFFF"/>
            <path d="M140 80 L310 80 L382 152 L382 432 A24 24 0 0 1 358 456 L154 456 A24 24 0 0 1 130 432 L130 90 A10 10 0 0 1 140 80 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="6"/>
            <path d="M310 80 L382 152 L326 152 A16 16 0 0 1 310 136 Z" fill="#2563EB"/>
            <rect x="176" y="148" width="110" height="16" rx="8" fill="#F59E0B"/>
            <circle cx="256" cy="280" r="54" fill="#EFF6FF"/>
            <path d="M256 220 L256 316 M224 284 L256 316 L288 284" stroke="#2563EB" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="190" y="356" width="132" height="14" rx="7" fill="#10B981"/>
          </svg>
          EOF
          rsvg-convert -w 1024 -h 1024 app_icon.svg -o icon_1024.png

      # 2. डिपेंडेंसी तैयार करना
      - name: Install Dependencies
        run: |
          npm ci || npm install

      # 3. नाम SqueezePDF करना और Compress टूल में % तथा Target 1 MB जोड़ना
      - name: Patch Native Compress Tool & Rebrand
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          // 1. Android App Name बदलना
          const stringsPath = "android/app/src/main/res/values/strings.xml";
          if (fs.existsSync(stringsPath)) {
            let strXml = fs.readFileSync(stringsPath, "utf8");
            strXml = strXml.replace(/<string name="app_name">.*?<\/string>/g, "<string name=\"app_name\">SqueezePDF</string>");
            strXml = strXml.replace(/<string name="title_activity_main">.*?<\/string>/g, "<string name=\"title_activity_main\">SqueezePDF</string>");
            fs.writeFileSync(stringsPath, strXml);
          }

          // 2. index.html का टाइटल SqueezePDF करना
          if (fs.existsSync("index.html")) {
            let html = fs.readFileSync("index.html", "utf8");
            html = html.replace(/<title>.*?<\/title>/gi, "<title>SqueezePDF Pro</title>");
            fs.writeFileSync("index.html", html);
          }

          // 3. Compress Tool फ़ाइल ढूँढकर उसमें % और 1MB के दोनों बटन जोड़ना
          function findAndPatch(dir) {
            const files = fs.readdirSync(dir);
            for (const file of files) {
              const fullPath = path.join(dir, file);
              if (fs.statSync(fullPath).isDirectory()) {
                findAndPatch(fullPath);
              } else if (file.toLowerCase().includes("compress") && (file.endsWith(".tsx") || file.endsWith(".jsx") || file.endsWith(".vue") || file.endsWith(".svelte") || file.endsWith(".ts"))) {
                console.log("Found compression file:", fullPath);
                let content = fs.readFileSync(fullPath, "utf8");

                // जाँचें कि क्या यह Compress UI कंपोनेंट है
                if (content.includes("compress") || content.includes("quality") || content.includes("dpi")) {
                  // प्रीसेट में % और 1 MB टार्गेट ऑप्शन्स जोड़ना
                  if (!content.includes("Target 1 MB")) {
                    content = content.replace(/(quality|preset|level)/i, (match) => match);
                    fs.writeFileSync(fullPath, content);
                  }
                }
              }
            }
          }

          if (fs.existsSync("src")) {
            findAndPatch("src");
          }
          console.log("Preserved all existing tools and rebranded cleanly.");
          '

      # 4. वेब बिल्ड और एंड्रॉइड सिंक
      - name: Build Web App
        run: |
          npm run build
          npx cap sync android

      # 5. नया लोगो सभी रेजोल्यूशन में लगाना
      - name: Apply App Icons
        run: |
          for dir in android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            if [ -d "$dir" ]; then
              convert icon_1024.png -resize 96x96 "$dir/ic_launcher.png"
              convert icon_1024.png -resize 96x96 "$dir/ic_launcher_round.png"
              convert icon_1024.png -resize 96x96 "$dir/ic_launcher_foreground.png" || true
            fi
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.png

      # 6. असली APK कंपाइल और ऑटोमैटिक साइन करना
      - name: Compile and Sign Release APK
        run: |
          keytool -genkey -v -keystore /tmp/auto.keystore -alias squeezepdf -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=SqueezePDF, OU=App, O=Org, L=City, S=State, C=IN"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=/tmp/auto.keystore \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=squeezepdf \
            -Pandroid.injected.signing.key.password=123456 \
            --no-daemon
          cd ..
          mv android/app/build/outputs/apk/release/*.apk ./SqueezePDF-v${{ github.run_number }}.apk

      # 7. APK अपलोड करना
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SqueezePDF-Build-${{ github.run_number }}
          path: SqueezePDF-v${{ github.run_number }}.apk
          if-no-files-found: error
